<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tree Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Tree Game</h1>
    <p>Plant trees, grow your forest, and keep the ecosystem healthy.</p>
    <button id="startBtn">Start Game</button>
    <section id="game" class="hidden">
      <div class="status">Trees planted: <span id="treeCount">0</span></div>
      <button id="plantBtn">Plant a Tree</button>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
